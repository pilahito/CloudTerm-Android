name: APK de Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decodificar keystore estable
        run: base64 -d store/cloudterm.jks.b64 > store/cloudterm.jks

      - name: Compilar APK firmado release
        run: gradle :app:assembleRelease --no-daemon

      # La version se lee del build.gradle.kts para que el nombre del APK y el de
      # la release no se queden atras al subir de version. Antes estaba escrita a
      # mano y se publico un APK 1.3.8 con el nombre 1.3.7.
      - name: Averiguar la version
        id: v
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version detectada: $V"

      - name: Nombrar y comprobar firma
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/release/*.apk "dist-apk/CloudTerm-android-${{ steps.v.outputs.version }}.apk"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "dist-apk/CloudTerm-android-${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-Android-${{ steps.v.outputs.version }}
          path: dist-apk/*.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: CloudTerm Android ${{ steps.v.outputs.version }}
          body: |
            ## CloudTerm Android ${{ steps.v.outputs.version }}

            **Aviso cuando la clave del servidor ha cambiado.** El diálogo de
            huella pintaba igual un servidor desconocido y una clave que ya no
            es la que aceptaste: mismo texto y mismo botón, así que el aviso no
            protegía de nada. Ahora sale una pantalla aparte que explica que la
            clave no es la de antes —puede ser una reinstalación o alguien en
            medio—, enseña la huella nueva y deja «Confiar de todos modos» como
            opción de riesgo, con «Cancelar y revisar» destacada.

            **La terminal ya no nace con una sola fila.** En el WebView el
            contenedor se quedaba en 8 px y la sesión se abría con una fila: el
            prompt salía cortado. Ahora se ajusta al alto real y se reajusta
            cuando aparece el teclado en pantalla.

            Además: «conexión rechazada» ya no se cuenta como «ese puerto es
            FTPS/FTP» —en un 2222 el mensaje era directamente falso—, y la lista
            de servidores enseña el puerto cuando no es el de siempre.
          files: dist-apk/*.apk
          draft: false
          fail_on_unmatched_files: true
