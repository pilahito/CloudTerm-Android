name: APK de Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decodificar keystore estable
        run: base64 -d store/cloudterm.jks.b64 > store/cloudterm.jks

      - name: Compilar APK firmado release
        run: gradle :app:assembleRelease --no-daemon

      - name: Nombrar y comprobar firma
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/release/*.apk dist-apk/CloudTerm-android-1.3.7.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose dist-apk/CloudTerm-android-1.3.7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-Android-1.3.7
          path: dist-apk/*.apk

      - name: Publicar release v1.3.7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.7' }}
          name: CloudTerm Android 1.3.7
          body: |
            ## CloudTerm Android 1.3.7

            Sesión con chrome mint: logo hexagonal, pestañas cian,
            IA y Pixel Agents con tarjetas del tema.
            Home sigue el vídeo (hero + oficina isométrica).
          files: dist-apk/*.apk
          draft: false
          fail_on_unmatched_files: true
