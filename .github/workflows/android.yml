name: APK de Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (debug)
        run: gradle :app:assembleDebug --no-daemon

      - name: Nombrar el APK
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/*.apk dist-apk/CloudTerm-android-1.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-Android-1.2.0
          path: dist-apk/*.apk

      - name: Publicar release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: CloudTerm Android 1.2.0
          body: |
            ## CloudTerm Android 1.2.0

            APK nativo (Kotlin). Interfaz mint + logo hexagonal.

            - SSH, SFTP, FTP y FTPS
            - SSH keyboard-interactive + TOTP 2FA (secreto en Keystore)
            - Editor propio con resaltado token a token
            - Pixel Agents: narración de cada transferencia
            - Asistente IA con detector de tarea
            - Huella: biométrica de la app + fingerprint SSH del host
            - Sin logs del servidor en público

            Referencia visual: el vídeo de ejemplo del repo de escritorio.
          files: dist-apk/*.apk
          draft: false
          fail_on_unmatched_files: true
