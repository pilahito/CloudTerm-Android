name: APK de Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decodificar keystore estable
        run: base64 -d store/cloudterm.jks.b64 > store/cloudterm.jks

      - name: Compilar APK firmado
        run: gradle :app:assembleRelease --no-daemon

      - name: Nombrar el APK
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/release/*.apk dist-apk/CloudTerm-android-1.3.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-Android-1.3.1
          path: dist-apk/*.apk

      - name: Publicar release v1.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.1' }}
          name: CloudTerm Android 1.3.1
          body: |
            ## CloudTerm Android 1.3.1

            APK firmado con keystore estable (se puede actualizar).

            Si sale "Aplicación no instalada":
            1. Desinstala CloudTerm anterior (Ajustes → Apps).
            2. En el navegador o Archivos: permitir instalar apps desconocidas.
            3. Instala este APK otra vez.

            - SSH, SFTP, FTP y FTPS
            - 2FA TOTP + huella
            - Editor propio + Pixel Agents + IA
          files: dist-apk/*.apk
          draft: false
          fail_on_unmatched_files: true
