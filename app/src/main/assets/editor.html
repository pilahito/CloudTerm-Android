<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #0f1419; color: #e6edf3; font-family: ui-monospace, Consolas, monospace; }
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #161b22; border-bottom: 1px solid #30363d; font-size: 12px; flex-wrap: wrap; }
  #name { flex: 1; min-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #7ee787; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 5px 8px; font-weight: 600; }
  button.sec { background: #30363d; }
  #wrap { height: calc(100% - 70px); }
  .CodeMirror { height: 100%; font-size: 13px; background: #0f1419; }
  #code { width: 100%; height: 100%; margin: 0; border: 0; outline: 0; resize: none; background: #0f1419; color: #e6edf3; padding: 8px; font: 13px/1.55 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div id="bar">
  <div id="name">sin archivo</div>
  <span id="lang"></span>
  <button class="sec" onclick="ctFormat()">Formatear</button>
  <button class="sec" onclick="ctComment()">//</button>
  <button class="sec" onclick="ctSnippet()">Snippet</button>
  <button id="save" onclick="doSave()">Guardar</button>
</div>
<div id="wrap"><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script>
  const ta = document.getElementById('code');
  const nameEl = document.getElementById('name');
  const langEl = document.getElementById('lang');
  let cm = null;
  function modeOf(name) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    const map = {
      js:'javascript', mjs:'javascript', cjs:'javascript', ts:'javascript', tsx:'javascript', jsx:'javascript',
      json:'application/json', kt:'text/x-java', kts:'text/x-java', java:'text/x-java', c:'text/x-csrc', h:'text/x-csrc',
      cpp:'text/x-c++src', cc:'text/x-c++src', cs:'text/x-csharp', py:'python', php:'php', html:'htmlmixed', htm:'htmlmixed',
      css:'css', scss:'css', xml:'xml', svg:'xml', md:'markdown', sh:'shell', bash:'shell', yml:'yaml', yaml:'yaml', sql:'sql'
    };
    return map[ext] || 'text/plain';
  }
  function languageOf(name) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    const map = {kt:'Kotlin',kts:'Kotlin',java:'Java',js:'JavaScript',ts:'TypeScript',py:'Python',php:'PHP',html:'HTML',css:'CSS',json:'JSON',md:'Markdown',sh:'Shell',yml:'YAML',sql:'SQL',go:'Go',rs:'Rust'};
    return map[ext] || ext.toUpperCase();
  }
  function value() { return cm ? cm.getValue() : ta.value; }
  function setValue(v) { if (cm) cm.setValue(v); else ta.value = v; try { Android.changed(v); } catch (e) {} }
  function doSave() { try { Android.save(value()); } catch (e) {} }
  function ctFormat() {
    const lines = value().split('\n');
    let depth = 0;
    const out = lines.map(function (line) {
      const t = line.trim();
      if (/^[}\])]/.test(t)) depth = Math.max(0, depth - 1);
      const s = '  '.repeat(depth) + t;
      if (/[{\[(]$/.test(t) && !t.startsWith('//')) depth++;
      return s;
    });
    setValue(out.join('\n'));
  }
  function ctComment() {
    setValue(value().split('\n').map(function (l) {
      return l.startsWith('//') ? l.replace(/^\/\/\s?/, '') : '// ' + l;
    }).join('\n'));
  }
  function ctSnippet() {
    const ext = (nameEl.textContent.split('.').pop() || '').toLowerCase();
    const map = {
      html: '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<title></title>\n</head>\n<body>\n\n</body>\n</html>\n',
      py: 'def main():\n    pass\n\nif __name__ == "__main__":\n    main()\n',
      js: 'function main() {\n  \n}\n\nmain();\n',
      kt: 'fun main() {\n    println("hola")\n}\n'
    };
    setValue(value() + (value() && !value().endsWith('\n') ? '\n' : '') + (map[ext] || 'fn() {\n  \n}\n'));
  }
  function bindFallback() {
    ta.addEventListener('input', function () { try { Android.changed(ta.value); } catch (e) {} });
  }
  function setFile(name, text, language) {
    nameEl.textContent = name || 'sin archivo';
    langEl.textContent = language || languageOf(name || '') || '';
    if (cm) {
      cm.setOption('mode', modeOf(name || ''));
      cm.setValue(text || '');
      cm.focus();
    } else {
      ta.value = text || '';
      ta.focus();
    }
  }
  window.setFile = setFile;
  window.languageOf = languageOf;
  window.ctFormat = ctFormat;
  window.ctComment = ctComment;
  window.ctSnippet = ctSnippet;
  if (window.CodeMirror) {
    cm = CodeMirror.fromTextArea(ta, {
      theme: 'material-darker',
      lineNumbers: true,
      indentUnit: 2,
      tabSize: 2,
      lineWrapping: true,
      inputStyle: 'contenteditable'
    });
    cm.on('change', function () { try { Android.changed(cm.getValue()); } catch (e) {} });
  } else {
    bindFallback();
  }
  try { Android.ready(); } catch (e) {}
</script>
</body>
</html>
