<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #1e2327; overflow: hidden; }
  /* El alto se fija por JavaScript (ver «ajustar»): en el WebView de Android
     `height: 100%` se resuelve contra un bloque de altura cero, el contenedor
     se quedaba en 8 px y la terminal salía de una sola fila. */
  #t { height: 100vh; padding: 4px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="t"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const term = new Terminal({
    fontFamily: 'monospace',
    fontSize: 14,
    cursorBlink: true,
    scrollback: 5000,
    theme: { background: '#1e2327' }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('t'));

  // Alto explícito, en píxeles, del viewport real. El WebView de Android mide
  // `window.innerHeight` bien aunque `html`/`body` digan 0, así que de ahí sale
  // el tamaño bueno. Sin esto, `fit()` calculaba 47x1 y la terminal no se veía.
  const caja = document.getElementById('t');
  function ajustar() {
    const alto = window.innerHeight || document.documentElement.clientHeight || 0;
    if (alto > 0) caja.style.height = alto + 'px';
    fit.fit();
    return term.rows;
  }

  term.onData(function (d) { Android.input(d); });
  term.onResize(function (s) { Android.resize(s.cols, s.rows); });
  window.addEventListener('resize', ajustar);
  // El WebView cambia de tamaño cuando aparece el teclado en pantalla: con el
  // observador, la terminal se reajusta sola en vez de quedarse con las filas
  // de cuando se abrió.
  if (window.ResizeObserver) new ResizeObserver(function () { fit.fit(); }).observe(caja);

  // En Android el IME manda keyCode 229 además del evento input:
  // si xterm procesa los dos, cada letra se duplica.
  term.attachCustomKeyEventHandler(function (ev) {
    if (ev.keyCode === 229 || ev.key === 'Unidentified' || ev.key === 'Process') {
      return false;
    }
    return true;
  });

  if (term.textarea) {
    term.textarea.setAttribute('autocomplete', 'off');
    term.textarea.setAttribute('autocorrect', 'off');
    term.textarea.setAttribute('autocapitalize', 'off');
    term.textarea.setAttribute('spellcheck', 'false');
  }

  function writeB64(b64) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    term.write(u);
  }

  term.onSelectionChange(function () {
    try {
      var sel = term.getSelection();
      if (sel) Android.copy(sel);
    } catch (e) {}
  });

  function copySelection() {
    try {
      var sel = term.getSelection();
      if (sel) Android.copy(sel);
      return sel || '';
    } catch (e) { return ''; }
  }

  term.focus();

  // Al shell se le dice el tamaño cuando la medida ya es de verdad. Si se
  // abriera con una sola fila, el PTY remoto nace con una fila y el prompt
  // sale cortado; se reintenta hasta que el WebView tenga alto.
  (function avisar(intentos) {
    const filas = ajustar();
    if (filas > 1 || intentos <= 0) {
      Android.ready(term.cols, term.rows);
      return;
    }
    setTimeout(function () { avisar(intentos - 1); }, 50);
  })(40);
</script>
</body>
</html>
